<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>左右比較｜Webサイト比較デモ</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#0f172a;color:#fff}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:#111827;border-bottom:1px solid rgba(255,255,255,.1)}.bar a{color:#fff;text-decoration:none}.grid{height:calc(100vh - 58px);display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.pane{background:#fff;border-radius:16px;overflow:hidden;position:relative}.label{position:absolute;top:10px;left:10px;z-index:3;background:rgba(15,23,42,.82);color:#fff;padding:6px 10px;border-radius:999px;font-size:.86rem;font-weight:800}iframe{width:100%;height:100%;border:0;background:#fff}@media(max-width:900px){.grid{height:auto;grid-template-columns:1fr}.pane{height:720px}}
  </style>
</head>
<body>
  <header class="bar"><a href="index.html">← 入口へ</a><strong>左右比較</strong></header>
  <main class="grid">
    <section class="pane"><div class="label">A</div><iframe src="A_ai_makase_site/index.html" title="AのWebサイト"></iframe></section>
    <section class="pane"><div class="label">B</div><iframe src="B_ai_wo_ugokasu_site/index.html" title="BのWebサイト"></iframe></section>
  </main>
</body>
</html>
